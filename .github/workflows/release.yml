name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: soblox-rpc-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: soblox-rpc-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: soblox-rpc-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: soblox-rpc-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/soblox-rpc

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/soblox-rpc.exe target/${{ matrix.target }}/release/soblox-rpc-windows-amd64.exe

      - name: Rename binary (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cp target/${{ matrix.target }}/release/soblox-rpc target/${{ matrix.target }}/release/soblox-rpc-linux-amd64

      - name: Rename binary (macOS Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: cp target/${{ matrix.target }}/release/soblox-rpc target/${{ matrix.target }}/release/soblox-rpc-macos-amd64

      - name: Rename binary (macOS ARM)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cp target/${{ matrix.target }}/release/soblox-rpc target/${{ matrix.target }}/release/soblox-rpc-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/soblox-rpc-*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read changelog
        id: changelog
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artifacts/**/*
